id: org.signal.Signal
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable
command: signal-desktop
separate-locales: false
finish-args:
  # X11 performance
  - --share=ipc
  # We need X11
  - --socket=fallback-x11
  # Access to wayland
  - --socket=wayland
  # Audio Access
  - --socket=pulseaudio
  # All devices (camera, microphone for calls)
  - --device=all
  # Network Access
  - --share=network
  # We need to be able to inhibit sleep
  - --system-talk-name=org.freedesktop.login1
  - --talk-name=org.freedesktop.PowerManagement
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.SessionManager
  # Secrets storage
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd6
  # These are for notifications/tray icons
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=com.canonical.Unity
  - --talk-name=com.canonical.indicator.application
  - --talk-name=org.ayatana.indicator.application
  - --talk-name=org.gnome.Mutter.IdleMonitor
  - --talk-name=org.kde.StatusNotifierWatcher
  # Environment Variables to control the behavior
  - --env=SIGNAL_DISABLE_GPU=0
  - --env=SIGNAL_DISABLE_GPU_SANDBOX=0
  - --env=SIGNAL_PASSWORD_STORE=basic
  # Use same mouse cursors as host
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

cleanup-commands:
  - rm -f /app/bin/patch-electron-desktop-filename

modules:
  - name: signal-desktop
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin
      prepend-path: /run/build/signal-desktop/pnpm-home:/run/build/signal-desktop/bin
      env:
        npm_config_nodedir: /usr/lib/sdk/node24
        PNPM_HOME: /run/build/signal-desktop/pnpm-home
        # package.json's file list references this env var.
        SIGNAL_ENV: production
        # flatpak-cargo-generator writes its vendor config to a cargo/ dir in the build root.
        CARGO_HOME: /run/build/signal-desktop/cargo
        CARGO_NET_OFFLINE: 'true'
        PROTOC: /run/build/signal-desktop/protoc/bin/protoc
        OUTPUT_DIR: /run/build/signal-desktop/ringrtc-src/out
        CARGO_PROFILE_RELEASE_DEBUG: '2'
    build-commands:
      - |
        set -e
        mkdir -p pnpm-cli bin
        tar -xzf pnpm-11.24.0.tgz -C pnpm-cli --strip-components=1
        # pnpm.mjs has its own "#!/usr/bin/env node" shebang and is already executable.
        ln -s ../pnpm-cli/bin/pnpm.mjs bin/pnpm
        # Build RingRTC's native Node addon from source instead of using its
        # prebuilt (which pnpm 11 can no longer fetch automatically): use the
        # SDK's Rust extension and vendored Cargo deps, then compile against
        # Signal's prebuilt WebRTC static library. Building WebRTC itself
        # from scratch needs Chromium's depot_tools and Google auth, so
        # that's out of scope here.
        rust_triple=$(uname -m)-unknown-linux-gnu
        node_arch=$(node -p process.arch)
        # Rewrite the vendor path to absolute since we cd into ringrtc-src (needed for its .cargo/config.toml) before invoking cargo.
        sed -i "s#directory = \"cargo/vendor\"#directory = \"${FLATPAK_BUILDER_BUILDDIR}/cargo/vendor\"#" "${CARGO_HOME}/config"
        mkdir -p ringrtc-src/out/release/obj
        tar -xjf webrtc.tar.bz2 -C ringrtc-src/out
        (
          cd ringrtc-src
          # Warn (don't fail) if a future bump needs a newer Rust than the SDK extension provides.
          required_rust=$(cat rust-toolchain)
          installed_rust=$(rustc --version | cut -d' ' -f2)
          printf '%s\n%s\n' "$required_rust" "$installed_rust" | sort -C -V ||
            echo "warning: ringrtc pins rust-toolchain ${required_rust}, newer than installed rust-stable ${installed_rust}" >&2
          cargo rustc --offline --package ringrtc --target "${rust_triple}" --features electron --release --crate-type cdylib
        )
        install -m 0755 "ringrtc-src/target/${rust_triple}/release/libringrtc.so" "${FLATPAK_BUILDER_BUILDDIR}/libringrtc-${node_arch}.node"
        # Not needed once we have the addon.
        rm -rf ringrtc-src/target ringrtc-src/out "${FLATPAK_BUILDER_BUILDDIR}/protoc"
        rm -f webrtc.tar.bz2
        # Skip pnpm 11's online supply-chain verification (needs registry metadata we don't have offline); we trust this pinned lockfile.
        echo "trustLockfile: true" >> pnpm-workspace.yaml
        pnpm install --offline --frozen-lockfile
        mkdir -p node_modules/@signalapp/ringrtc/build/linux
        install -m 0755 "${FLATPAK_BUILDER_BUILDDIR}/libringrtc-${node_arch}.node" "node_modules/@signalapp/ringrtc/build/linux/libringrtc-${node_arch}.node"
        # Build @signalapp/sqlcipher's native addon from source: it ships a prebuilt
        # (found automatically by node-gyp-build, so pnpm install never compiles it),
        # overwritten below with our own build using node-sqlcipher's pinned nightly.
        # The fetched tarball's name carries the pinned nightly date.
        rust_tarball=$(ls "rust-nightly-"*"-${rust_triple}.tar.gz")
        pinned_rust=${rust_tarball#rust-}
        pinned_rust=${pinned_rust%-${rust_triple}.tar.gz}
        mkdir -p "${FLATPAK_BUILDER_BUILDDIR}/rust-nightly-sqlcipher"
        for component in rustc cargo "rust-std-${rust_triple}"; do
          tar -xzf "${rust_tarball}" --strip-components=2 -C "${FLATPAK_BUILDER_BUILDDIR}/rust-nightly-sqlcipher" "rust-nightly-${rust_triple}/${component}"
        done
        # Warn (don't fail) if a bump moved sqlcipher off the nightly this manifest fetches.
        required_rust=$(cat sqlcipher-src/rust-toolchain)
        [ "$required_rust" = "${pinned_rust}" ] ||
          echo "warning: sqlcipher-src/rust-toolchain says ${required_rust}, but this manifest still pins ${pinned_rust}" >&2
        (
          export PATH="${FLATPAK_BUILDER_BUILDDIR}/rust-nightly-sqlcipher/bin:${PATH}"
          sed -i "s#directory = \"cargo/vendor\"#directory = \"${CARGO_HOME}/vendor\"#" "${CARGO_HOME}/config"
          # Signal-Desktop's install already holds node-gyp and the node-addon-api that binding.gyp requires; reuse them instead of installing node-sqlcipher's own ~440-package dev set.
          export NODE_PATH=$(ls -d "${PWD}"/node_modules/.pnpm/@signalapp+sqlcipher@*/node_modules | tail -1)
          node_gyp=$(ls -d "${PWD}"/node_modules/.pnpm/node-gyp@*/node_modules/node-gyp | tail -1)
          cd sqlcipher-src
          node "${node_gyp}/bin/node-gyp.js" rebuild
        )
        install -m 0755 sqlcipher-src/build/Release/node_sqlcipher.node "node_modules/@signalapp/sqlcipher/prebuilds/linux-${node_arch}/@signalapp+sqlcipher.node"
        # Not needed once we have the addon.
        rm -rf sqlcipher-src/build sqlcipher-src/target "${FLATPAK_BUILDER_BUILDDIR}/cargo" "${FLATPAK_BUILDER_BUILDDIR}/rust-nightly-sqlcipher"
        rm -f "${rust_tarball}"
        pnpm run build:policy-files
        pnpm run generate
        pnpm run build:rolldown:prod
        # A Flatpak can't update itself, and the Linux updater refuses to start outside an ASAR.
        jq '.updatesEnabled = false' config/production.json > config/production.json.new
        mv config/production.json.new config/production.json
        # electron-builder's patched cache scheme differs from flatpak-node-generator's; point it at our pre-fetched electron zip directly.
        pnpm exec electron-builder --linux dir --publish=never --config.directories.output=release --config.electronDist=flatpak-node/cache/electron --config.asar=false
        # Signal's afterPack fuses Electron to load only from an ASAR; undo that for the plain app directory.
        pnpm exec electron-fuses write --app release/linux-*unpacked/signal-desktop OnlyLoadAppFromAsar=off
      - mv release/linux-*unpacked "${FLATPAK_DEST}/Signal"
      - install -Dm0644 "org.signal.Signal.desktop" "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - |
        for size in 16 24 32 48 64 128 256 512; do
          install -Dm0644 "build/icons/png/${size}x${size}.png" "${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/${FLATPAK_ID}.png"
        done
      - install -Dm0755 signal-desktop.sh "${FLATPAK_DEST}/bin/signal-desktop"
      - install -Dm0644 "${FLATPAK_ID}.metainfo.xml" "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml"
      - desktop-file-edit --set-key=Exec --set-value='signal-desktop %U' "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - desktop-file-edit --set-key=Icon --set-value="${FLATPAK_ID}" "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - desktop-file-edit --set-key=X-Flatpak-RenamedFrom --set-value='signal-desktop.desktop;' "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - |
        app="${FLATPAK_DEST}/Signal/resources/app"
        jq --arg name "${FLATPAK_ID}.desktop" '.desktopName = $name' "${app}/package.json" > "${app}/package.json.new"
        mv "${app}/package.json.new" "${app}/package.json"
    sources:
      # Pinned to a release tag, not a branch: generated-sources.json is derived
      # from this tree's pnpm-lock.yaml and has to be regenerated whenever the tag
      # moves, so the checker below cannot be left to bump it unattended.
      - type: git
        url: https://github.com/signalapp/Signal-Desktop.git
        tag: v8.29.0
        commit: 66084e9ee4e3f04f4b9ff1c525b767fbf2c759c4
        x-checker-data:
          type: git
          # Stable releases only; beta tags look like v8.28.0-beta.3.
          tag-pattern: '^v([\d.]+)$'
          version-scheme: semantic
          is-main-source: true
          source-id: signal-desktop
      # In a checkout of the pinned commit, with a flatpak-node-generator that reads pnpm 11's two-document lockfile (flatpak/flatpak-builder-tools#559):
      # flatpak-node-generator pnpm pnpm-lock.yaml -o generated-sources.json --node-sdk-extension org.freedesktop.Sdk.Extension.node24//26.08 --pnpm-store-version v11
      - generated-sources.json
      - type: file
        # Straight from the registry, not corepack: it can neither write into the read-only SDK mount nor fetch itself offline.
        url: https://registry.npmjs.org/pnpm/-/pnpm-11.24.0.tgz
        sha256: d1eab2433172661cc36a18ec85fce93f771db1962717329cc01ec9c2824ca24f
      # @signalapp/sqlcipher, built from source instead of using its prebuilt.
      - type: git
        url: https://github.com/signalapp/node-sqlcipher.git
        commit: 0efcacbbc81360e3be5aa414109d12e50bb72642
        tag: v4.1.0
        dest: sqlcipher-src
        x-checker-data:
          type: json
          parent-id: signal-desktop
          # The tag to build is whatever version of "@signalapp/sqlcipher" Signal-Desktop's own package.json pins at its new tag, not node-sqlcipher's own latest release.
          tag-data-url: '"https://raw.githubusercontent.com/signalapp/Signal-Desktop/" + $parent.new.tag + "/package.json"'
          tag-query: '"v" + .dependencies["@signalapp/sqlcipher"]'
          version-query: '$tag | ltrimstr("v")'
      - type: file
        url: https://static.rust-lang.org/dist/2026-07-21/rust-nightly-x86_64-unknown-linux-gnu.tar.gz
        sha256: 730fe2ba62b37260b4c92ef9b98a88ed9c4d2eb88c9fcf28e096fb6ce662c321
        dest-filename: rust-nightly-2026-07-21-x86_64-unknown-linux-gnu.tar.gz
        only-arches: [x86_64]
      - type: file
        url: https://static.rust-lang.org/dist/2026-07-21/rust-nightly-aarch64-unknown-linux-gnu.tar.gz
        sha256: d5845f89ba81af78ebc9c8bca3eb6f03cb67194646a458ac7357aef1e1f43923
        dest-filename: rust-nightly-2026-07-21-aarch64-unknown-linux-gnu.tar.gz
        only-arches: [aarch64]
      # RingRTC, built from source instead of using its prebuilt binary.
      # When bumping, check config/version.properties' webrtc.version against
      # the pinned tarball below (rust-toolchain fitness is checked at build time).
      - type: git
        url: https://github.com/signalapp/ringrtc.git
        commit: a1d2ffed1de6ac5b22458a3dced8374513cc44f8
        tag: v2.72.0
        dest: ringrtc-src
        x-checker-data:
          type: json
          parent-id: signal-desktop
          # The tag to build is whatever version of "@signalapp/ringrtc" Signal-Desktop's own package.json pins at its new tag, not ringrtc's own latest release.
          tag-data-url: '"https://raw.githubusercontent.com/signalapp/Signal-Desktop/" + $parent.new.tag + "/package.json"'
          tag-query: '"v" + .dependencies["@signalapp/ringrtc"]'
          version-query: '$tag | ltrimstr("v")'
      - type: file
        url: https://build-artifacts.signal.org/libraries/webrtc-7871k-linux-x64-release.tar.bz2
        sha256: 7a0100cbdea708318d9cbb29c0e337c5ce9450894f9faf7e965304ff9961d799
        dest-filename: webrtc.tar.bz2
        only-arches: [x86_64]
      - type: file
        url: https://build-artifacts.signal.org/libraries/webrtc-7871k-linux-arm64-release.tar.bz2
        sha256: 9e24ef6137aa272bd6d4af9ef72368bde74757ddbe86bea8d02075a2c05c6152
        dest-filename: webrtc.tar.bz2
        only-arches: [aarch64]
      # RingRTC's own "protobuf" crate needs a protoc binary at build time.
      - type: archive
        url: https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
        sha256: 3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a
        dest: protoc
        strip-components: 0
        only-arches: [x86_64]
      - type: archive
        url: https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-aarch_64.zip
        sha256: 6427349140e01f06e049e707a58709a4f221ae73ab9a0425bc4a00c8d0e1ab32
        dest: protoc
        strip-components: 0
        only-arches: [aarch64]
      # flatpak-cargo-generator.py <cubeb-sys crate>/src/cubeb-pulse-rs/Cargo.lock -o cubeb-pulse-rs-cargo-sources.json -- the lock it ships can be stale against its own Cargo.toml, so "cargo update -p cubeb-backend --precise <version>" first.
      - cubeb-pulse-rs-cargo-sources.json
      # flatpak-cargo-generator.py sqlcipher-src/deps/extension/Cargo.lock -o sqlcipher-extension-cargo-sources.json -- node-sqlcipher's bundled Rust FTS5-tokenizer extension.
      - sqlcipher-extension-cargo-sources.json
      # flatpak-cargo-generator.py ringrtc-src/Cargo.lock -o cargo-sources.json
      - cargo-sources.json
      # Each Cargo sources file above writes its own cargo/config and only the last one survives, so this merge of all of them comes last.
      - type: file
        path: cargo-config
        dest: cargo
        dest-filename: config
      - type: file
        path: signal-desktop.sh
      - type: file
        path: org.signal.Signal.desktop
      - type: file
        path: org.signal.Signal.metainfo.xml
      - type: file
        path: LICENSE.signal-desktop
