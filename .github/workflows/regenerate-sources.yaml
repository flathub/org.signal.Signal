name: Regenerate vendored sources
on:
  workflow_dispatch: {}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'flathub'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install flatpak-node-generator and flatpak-cargo-generator
        run: |
          # Includes https://github.com/flatpak/flatpak-builder-tools/pull/559 (reads pnpm 11's two-document lockfile).
          git init -q /tmp/flatpak-builder-tools
          git -C /tmp/flatpak-builder-tools fetch -q --depth 1 https://github.com/flatpak/flatpak-builder-tools.git 74697c75b630d7330e77250fc13cb5ea688d9479
          git -C /tmp/flatpak-builder-tools checkout -q FETCH_HEAD
          pip install /tmp/flatpak-builder-tools/node
          pip install "aiohttp<4.0.0,>=3.9.5" "PyYAML<7.0.0,>=6.0.2" "tomlkit>=0.13.3,<1.0"

      - name: Ensure a stable Rust toolchain is available
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Read pinned refs, runtime version and Node SDK extension from the manifest
        id: pin
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          manifest = yaml.safe_load(open("org.signal.Signal.yaml"))
          sources = manifest["modules"][0]["sources"]
          sqlcipher = next(s for s in sources if isinstance(s, dict) and s.get("dest") == "sqlcipher-src")
          ringrtc = next(s for s in sources if isinstance(s, dict) and s.get("dest") == "ringrtc-src")
          print(f"sd_tag={sources[0]['tag']}")
          print(f"runtime={manifest['runtime-version']}")
          node_ext = next(e for e in manifest["sdk-extensions"] if e.startswith("org.freedesktop.Sdk.Extension.node"))
          print(f"node_ext={node_ext}")
          print(f"sc_tag={sqlcipher['tag']}")
          print(f"rr_tag={ringrtc['tag']}")
          PY

      - name: Check out Signal-Desktop, node-sqlcipher and RingRTC at their pinned tags
        run: |
          git clone --depth 1 --branch "${{ steps.pin.outputs.sd_tag }}" https://github.com/signalapp/Signal-Desktop.git /tmp/Signal-Desktop
          git clone --depth 1 --branch "${{ steps.pin.outputs.sc_tag }}" https://github.com/signalapp/node-sqlcipher.git /tmp/sqlcipher-src
          git clone --depth 1 --branch "${{ steps.pin.outputs.rr_tag }}" https://github.com/signalapp/ringrtc.git /tmp/ringrtc-src

      - name: Regenerate generated-sources.json
        run: |
          flatpak-node-generator pnpm /tmp/Signal-Desktop/pnpm-lock.yaml -o generated-sources.json --node-sdk-extension ${{ steps.pin.outputs.node_ext }}//${{ steps.pin.outputs.runtime }} --pnpm-store-version v11

      - name: Regenerate sqlcipher-extension-cargo-sources.json
        run: python3 /tmp/flatpak-builder-tools/cargo/flatpak-cargo-generator.py /tmp/sqlcipher-src/deps/extension/Cargo.lock -o sqlcipher-extension-cargo-sources.json

      - name: Regenerate cubeb-pulse-rs-cargo-sources.json
        run: |
          # cubeb-sys vendors cubeb-pulse-rs as a nested crate with its own Cargo.lock; a real
          # cargo fetch resolves and downloads it so the generator can be pointed at it directly.
          (cd /tmp/ringrtc-src && cargo fetch)
          cubeb_sys_dir=$(find "$HOME/.cargo/registry/src" -maxdepth 2 -iname 'cubeb-sys-*' -type d | head -1)
          pulse_dir="$cubeb_sys_dir/src/cubeb-pulse-rs"
          # Its shipped Cargo.lock can be stale against its own Cargo.toml.
          required=$(grep '^cubeb-backend' "$pulse_dir/Cargo.toml" | sed -E 's/.*"\^?([0-9.]+)".*/\1/')
          (cd "$pulse_dir" && cargo update -p cubeb-backend --precise "$required")
          python3 /tmp/flatpak-builder-tools/cargo/flatpak-cargo-generator.py "$pulse_dir/Cargo.lock" -o cubeb-pulse-rs-cargo-sources.json

      - name: Regenerate cargo-sources.json
        run: python3 /tmp/flatpak-builder-tools/cargo/flatpak-cargo-generator.py /tmp/ringrtc-src/Cargo.lock -o cargo-sources.json

      - name: Merge the cargo/config files into cargo-config
        run: |
          # Each Cargo sources file writes its own cargo/config; flatpak-builder keeps only the last.
          python3 - cubeb-pulse-rs-cargo-sources.json sqlcipher-extension-cargo-sources.json cargo-sources.json > cargo-config <<'PY'
          import json, sys, tomlkit
          merged = tomlkit.document()
          for path in sys.argv[1:]:
              entry = next(e for e in json.load(open(path)) if e.get("dest") == "cargo" and e.get("dest-filename") == "config")
              for table, values in tomlkit.parse(entry["contents"]).items():
                  merged.setdefault(table, tomlkit.table()).update(values)
          print(tomlkit.dumps(merged), end="")
          PY

      - name: Commit changes
        env:
          GIT_AUTHOR_NAME: Flatpak External Data Checker
          GIT_COMMITTER_NAME: Flatpak External Data Checker
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add generated-sources.json cargo-sources.json cubeb-pulse-rs-cargo-sources.json sqlcipher-extension-cargo-sources.json cargo-config
          git diff --cached --quiet || git commit -m "Regenerate vendored sources"
          git push
